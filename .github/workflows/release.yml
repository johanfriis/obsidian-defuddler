# Builds a release when a version tag is pushed, and attaches the three files BRAT installs.
#
# The tag must equal manifest.json's version, with no "v" prefix — BRAT matches them, and a
# mismatch installs nothing with no useful error. The job checks this before it builds.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "tag '$tag' != manifest version '$manifest'" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json styles.css
