# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX package structure.
android.useAndroidX=true
# Official Kotlin code style.
kotlin.code.style=official
# Non-transitive R classes: R class only contains this module's resources.
android.nonTransitiveRClass=true

# Configuration cache: skip the configuration phase when nothing affecting it changed.
org.gradle.configuration-cache=true
